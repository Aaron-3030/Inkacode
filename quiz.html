```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InkaCode | Quiz</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">⌘</span>
            <span>Inka<span class="logo-highlight">Code</span></span>
        </div>

        <a href="index.html" class="btn-salir">Salir del Quiz</a>
    </header>


    <!-- Contenido principal -->
    <main class="quiz-container">

        <!-- Información del Quiz -->
        <section class="quiz-header">

            <div class="quiz-info">
                <span class="categoria">Sistemas Operativos</span>
                <span class="pregunta-numero">Pregunta 1 de 10</span>
            </div>

            <!-- Barra de progreso -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress" style="width: 10%;"></div>
                </div>

                <span class="progress-text">10%</span>
            </div>

        </section>


        <!-- Tarjeta de pregunta -->
        <section class="question-card">

            <div class="question-number">
                Pregunta 01
            </div>

            <h1 class="question">
                ¿Cuál de los siguientes es un sistema operativo?
            </h1>

            <p class="instruction">
                Selecciona una respuesta:
            </p>


            <!-- Alternativas -->
            <div class="answers">

                <button class="answer">
                    <span class="answer-letter">A</span>
                    <span class="answer-text">MySQL</span>
                </button>

                <button class="answer">
                    <span class="answer-letter">B</span>
                    <span class="answer-text">Linux</span>
                </button>

                <button class="answer">
                    <span class="answer-letter">C</span>
                    <span class="answer-text">HTML</span>
                </button>

                <button class="answer">
                    <span class="answer-letter">D</span>
                    <span class="answer-text">Python</span>
                </button>

            </div>


            <!-- Navegación -->
            <div class="quiz-navigation">

                <span class="question-status">
                    1 / 10
                </span>

                <button class="btn-siguiente">
                    Siguiente
                    <span>→</span>
                </button>

            </div>

        </section>

    </main>


    <!-- Pie de página -->
    <footer class="footer">
        <p>© 2026 InkaCode — Aprende, practica y demuestra tus conocimientos.</p>
    </footer>

</body>

</html>
```
